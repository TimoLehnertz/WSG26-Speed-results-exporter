name: Scrape results & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the results regularly while the championship is running.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Start from the currently deployed results: completed races are not fetched again
      # (Vensport rate-limits), and pages that fail to load keep their previous data.
      # Falls back to the committed snapshot in public/data.
      - name: Download deployed results
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/results.json" -o previous.json \
            && node -e 'JSON.parse(require("fs").readFileSync("previous.json","utf8")).seasons.length' \
            && cp previous.json public/data/results.json \
            || echo "No deployed results, using committed snapshot"
      - name: Scrape latest results
        run: npm run scrape
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
